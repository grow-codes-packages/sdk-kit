# sdk-kit documentation site: https://grow-codes-packages.github.io/sdk-kit/
# Build: pip install -r docs/requirements.txt && mkdocs build --strict
site_name: sdk-kit
site_description: >-
  Specification, generator, conformance suite and reusable workflows for the Grow Codes
  open-source SDKs (TypeScript, Rust, Go, Python, Java).
site_author: Grow Codes
site_url: https://grow-codes-packages.github.io/sdk-kit/
repo_url: https://github.com/grow-codes-packages/sdk-kit
repo_name: grow-codes-packages/sdk-kit
edit_uri: edit/main/docs/
copyright: Copyright &copy; Grow Codes · Apache-2.0

exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: theme
  language: en
  icon:
    logo: grow/logo
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grow-codes-packages
      name: Grow Codes Packages on GitHub
    - icon: fontawesome/solid/seedling
      link: https://grow.codes
      name: Grow Codes

nav:
  - Overview: index.md
  - Specification: spec.md
  - Generate a repository: generate.md
  - Workflows reference: workflows.md
  - Docs theme: theme.md
  - Releasing sdk-kit: releasing.md
