[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sdk-kit"
dynamic = ["version"]
description = "Generator and maintenance tool for the Grow Codes open-source service SDK repositories"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Grow Codes", email = "opensource@grow.codes" }]
keywords = ["sdk", "generator", "codegen", "grow-codes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
sdk-kit = "sdk_kit.cli:main_entry"

[project.urls]
Homepage = "https://github.com/grow-codes-packages/sdk-kit"
Repository = "https://github.com/grow-codes-packages/sdk-kit"
Issues = "https://github.com/grow-codes-packages/sdk-kit/issues"

[tool.hatch.version]
path = "sdk_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sdk_kit"]

# The wheel carries the kit data so an installed sdk-kit can generate repositories on its own.
[tool.hatch.build.targets.wheel.force-include]
"template" = "sdk_kit/_kit/template"
"conformance" = "sdk_kit/_kit/conformance"
"spec" = "sdk_kit/_kit/spec"
"demo" = "sdk_kit/_kit/demo"

[tool.hatch.build.targets.sdist]
include = ["sdk_kit", "template", "conformance", "spec", "demo", "bin", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["sdk_kit"]
omit = ["sdk_kit/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "C4"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["sdk_kit"]
