# docker/compose.service.yml for the AWS services (`aws-secrets-manager`, `aws-cloudwatch-logs`):
# moto in server mode emulates the AWS APIs (sdk-kit/harness/moto). The bootstrap job runs
# bootstrap.py with the moto image's own Python + boto3, creates the fixtures below and writes the
# AWS credential chain + endpoint variables to /bootstrap/env.
# OWNED BY THIS REPOSITORY after generation (see docker/compose.yml for the harness contract).

services:
  service:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    networks:
      default:
        aliases: [moto]
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/moto-api/data.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 500ms

  bootstrap:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    depends_on:
      service:
        condition: service_healthy
    volumes:
      - bootstrap:/bootstrap
      - ./bootstrap:/scripts:ro
    environment:
      MOTO_URL: http://service:5000
      AWS_REGION: us-east-1
      # Fixtures (all optional). aws-secrets-manager: JSON object name -> value.
      MOTO_SECRETS: '{"grow-conformance/seed": "seed-value"}'
      # aws-cloudwatch-logs: log group + stream the suite writes to.
      MOTO_LOG_GROUP: /grow/conformance
      MOTO_LOG_STREAM: conformance
    entrypoint: ["python", "/scripts/bootstrap.py"]
    restart: "no"

volumes:
  bootstrap: {}
