# The service under test for the `demo` SDK: the sdk-kit demo server (Python stdlib), built from
# docker/demo/ (copied from sdk-kit/demo by `sdk-kit new demo`). It serves exactly the skeleton
# client paths: GET /health, GET /v1/ping (Bearer token), GET /version, plus /__fault test controls.
# OWNED BY THIS REPOSITORY after generation (see docker/compose.yml for the harness contract).

services:
  service:
    image: grow-sdk-demo-service:local
    build:
      context: demo
    networks:
      default:
        aliases: [demo]
    environment:
      DEMO_PORT: "8080"
      DEMO_TOKEN: ${GROW_DEMO_TOKEN:-demo-local-token}
    healthcheck:
      test: ["CMD", "python", "/app/server.py", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 500ms

  bootstrap:
    image: alpine:3.24.4
    depends_on:
      service:
        condition: service_healthy
    volumes:
      - bootstrap:/bootstrap
      - ./bootstrap:/scripts:ro
      - ./harness:/harness:ro
    environment:
      SERVICE_URL: http://service:8080
      DEMO_TOKEN: ${GROW_DEMO_TOKEN:-demo-local-token}
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    restart: "no"

volumes:
  bootstrap: {}
