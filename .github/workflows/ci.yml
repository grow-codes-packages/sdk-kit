# sdk-kit CI.
#
#   generator    `make lint test` (generator unit tests + coverage gate) and `make check-all`
#                (render all 17 services + demo, then `sdk-kit check` on each)
#   render       `sdk-kit new demo` → artifact `demo-source` (source.tar keeps file modes)
#   <lang>       the reusable language pipelines (./.github/workflows/lang-*.yml) on the rendered
#                demo repo — the same workflows the generated repos call
#   docker       Docker demo scenario per language (`make test-docker LANGS=<lang>` in the demo)
#   check        the reusable `sdk-kit check` workflow on the demo
#   demo-docs    the reusable docs workflow on the demo (no deploy)
#   workflows    actionlint on sdk-kit's and the template's workflows
#   docs         sdk-kit's own MkDocs site (theme/ mirror check); deployed to Pages from main
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator:
    name: generator (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: make lint test check-all
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: make PYTHON="$PYTHON" lint test check-all

  render:
    name: render demo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: sdk-kit new demo
        run: |
          bin/sdk-kit new demo --dest "$RUNNER_TEMP/demo"
          bin/sdk-kit check --dest "$RUNNER_TEMP/demo"
          tar -cf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP/demo" .
      - name: Upload demo source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-source
          path: ${{ runner.temp }}/source.tar
          if-no-files-found: error
          retention-days: 3

  typescript:
    needs: render
    uses: ./.github/workflows/lang-typescript.yml
    with:
      source-artifact: demo-source
  rust:
    needs: render
    uses: ./.github/workflows/lang-rust.yml
    with:
      source-artifact: demo-source
  go:
    needs: render
    uses: ./.github/workflows/lang-go.yml
    with:
      source-artifact: demo-source
  python:
    needs: render
    uses: ./.github/workflows/lang-python.yml
    with:
      source-artifact: demo-source
  java:
    needs: render
    uses: ./.github/workflows/lang-java.yml
    with:
      source-artifact: demo-source

  docker:
    name: docker demo
    needs: render
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, rust, go, python, java]
    uses: ./.github/workflows/docker-integration.yml
    with:
      lang: ${{ matrix.lang }}
      source-artifact: demo-source

  check:
    needs: render
    uses: ./.github/workflows/sdk-kit-check.yml
    with:
      source-artifact: demo-source
      sdk-kit-ref: ${{ github.sha }}

  demo-docs:
    needs: [typescript, rust, go, python, java]
    uses: ./.github/workflows/docs.yml
    # A caller must grant every permission any job of the called workflow declares, even when
    # that job (deploy) is skipped; otherwise the whole run fails at startup.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      source-artifact: demo-source
      deploy: false
      coverage-workflow: ""

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -p "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint -color .github/workflows/*.yml template/common/.github/workflows/*.yml

  docs:
    name: sdk-kit docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: theme/ and its template mirror are identical
        run: .github/scripts/sync-theme.sh --check
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build site
        run: |
          python -m pip install --disable-pip-version-check -r docs/requirements.txt
          mkdocs build --strict --site-dir _site
      - name: Upload site (Pages)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  docs-deploy:
    name: deploy sdk-kit docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages settings
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages not configured::Set Settings > Pages > Source to 'GitHub Actions' to publish the sdk-kit docs. Deploy skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
