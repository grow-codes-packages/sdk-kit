# Reusable Go pipeline for Grow Codes SDK repos (sdk-kit).
#
# Runs the language Makefile contract (deps lint build test coverage license pack)
# plus `make release-check` (release readiness, dry-run publish) on the primary job in
# `working-directory` on Go 1.26 and 1.27 (both run every target: the coverage gate and lint
# are cheap in Go). The Go 1.26 job uploads `coverage/summary.json` as `coverage-go`.
# golangci-lint and go-licenses are installed so the Makefile does not `go run` them.
#
#   jobs:
#     go:
#       uses: grow-codes-packages/sdk-kit/.github/workflows/lang-go.yml@main
name: lang-go

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds the Go module and its Makefile.
        type: string
        default: go
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
      golangci-lint-version:
        description: golangci-lint release used by `make lint`.
        type: string
        default: v2.15.0
      go-licenses-version:
        description: go-licenses release used by `make license`.
        type: string
        default: v2.0.1
      source-artifact:
        description: Optional artifact holding `source.tar` (a rendered repo) used instead of a checkout.
        type: string
        default: ""
      upload-artifacts:
        description: Upload coverage-go from the primary job.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.go }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.26"
            targets: deps lint build test coverage license pack
            primary: true
          - go: "1.27"
            targets: deps lint build test coverage
            primary: false
    env:
      WD: ${{ inputs.working-directory }}
      GOFLAGS: -p=4
    steps:
      - name: Check out
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered source
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/source
      - name: Unpack rendered source
        if: inputs.source-artifact != ''
        run: tar -xf "$RUNNER_TEMP/source/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}.x
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Install golangci-lint and go-licenses
        env:
          GOLANGCI_VERSION: ${{ inputs.golangci-lint-version }}
          GOLICENSES_VERSION: ${{ inputs.go-licenses-version }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"
          go install "github.com/google/go-licenses/v2@${GOLICENSES_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make ${{ matrix.targets }}
        run: make -C "$WD" ${{ matrix.targets }}

      - name: make release-check
        if: matrix.primary
        run: |
          if ! grep -q '^release-check:' "$WD/Makefile"; then
            echo "::warning title=release-check skipped::$WD/Makefile has no release-check target yet; update it from sdk-kit (template/go/Makefile)"
            exit 0
          fi
          make -C "$WD" release-check

      - name: Upload coverage summary
        if: matrix.primary && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: ${{ inputs.working-directory }}/coverage/summary.json
          if-no-files-found: error
          retention-days: 30
