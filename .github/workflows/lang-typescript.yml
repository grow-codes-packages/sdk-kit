# Reusable TypeScript pipeline for Grow Codes SDK repos (sdk-kit).
#
# Runs the language Makefile contract (deps lint build test coverage license pack)
# plus `make release-check` (release readiness, dry-run publish) on the primary job in
# `working-directory`. Node 24 (active LTS) runs every target and uploads
# `coverage/summary.json` as the artifact `coverage-typescript` plus the npm tarball as
# `dist-typescript`; Node 22 (maintenance LTS, the SPEC minimum) builds and tests.
#
#   jobs:
#     typescript:
#       uses: grow-codes-packages/sdk-kit/.github/workflows/lang-typescript.yml@main
name: lang-typescript

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds the TypeScript package and its Makefile.
        type: string
        default: typescript
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
      source-artifact:
        description: >-
          Optional artifact holding `source.tar` (a rendered repo). Used instead of a checkout,
          e.g. by sdk-kit CI for the rendered demo repo.
        type: string
        default: ""
      upload-artifacts:
        description: Upload coverage-typescript and dist-typescript from the primary job.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  typescript:
    name: typescript (node ${{ matrix.node }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            targets: deps build test
            primary: false
          - node: "24"
            targets: deps lint build test coverage license pack
            primary: true
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered source
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/source
      - name: Unpack rendered source
        if: inputs.source-artifact != ''
        run: tar -xf "$RUNNER_TEMP/source/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: make ${{ matrix.targets }}
        run: make -C "$WD" ${{ matrix.targets }}

      - name: make release-check
        if: matrix.primary
        run: |
          if ! grep -q '^release-check:' "$WD/Makefile"; then
            echo "::warning title=release-check skipped::$WD/Makefile has no release-check target yet; update it from sdk-kit (template/typescript/Makefile)"
            exit 0
          fi
          make -C "$WD" release-check

      - name: Upload coverage summary
        if: matrix.primary && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: ${{ inputs.working-directory }}/coverage/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload package
        if: matrix.primary && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-typescript
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7
