# Reusable Rust pipeline for Grow Codes SDK repos (sdk-kit).
#
# Runs the language Makefile contract (deps lint build test coverage license pack) in
# `working-directory`. The stable toolchain runs every target (clippy, cargo-llvm-cov,
# cargo-deny, cargo package) and uploads `coverage/summary.json` as `coverage-rust` plus the
# `.crate` as `dist-rust`; the MSRV toolchain (1.85, SPEC section 7) builds and tests.
#
#   jobs:
#     rust:
#       uses: grow-codes-packages/sdk-kit/.github/workflows/lang-rust.yml@main
name: lang-rust

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that holds the crate and its Makefile.
        type: string
        default: rust
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
      msrv:
        description: Minimum supported Rust version (built and tested, not linted).
        type: string
        default: "1.85"
      source-artifact:
        description: Optional artifact holding `source.tar` (a rendered repo) used instead of a checkout.
        type: string
        default: ""
      upload-artifacts:
        description: Upload coverage-rust and dist-rust from the stable job.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.toolchain }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            components: rustfmt, clippy, llvm-tools-preview
            targets: deps lint build test coverage license pack
            primary: true
          - toolchain: msrv
            components: ""
            targets: deps build test
            primary: false
    env:
      WD: ${{ inputs.working-directory }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Prefer dependency versions whose rust-version still builds on the MSRV.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - name: Check out
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered source
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/source
      - name: Unpack rendered source
        if: inputs.source-artifact != ''
        run: tar -xf "$RUNNER_TEMP/source/source.tar" -C "$GITHUB_WORKSPACE"

      - name: Set up Rust ${{ matrix.toolchain == 'msrv' && inputs.msrv || matrix.toolchain }}
        env:
          TOOLCHAIN: ${{ matrix.toolchain == 'msrv' && inputs.msrv || matrix.toolchain }}
          COMPONENTS: ${{ matrix.components }}
        run: |
          set --
          for c in $(echo "$COMPONENTS" | tr ',' ' '); do set -- "$@" --component "$c"; done
          rustup toolchain install "$TOOLCHAIN" --profile minimal "$@"
          rustup default "$TOOLCHAIN"
          rustc --version
      - name: Install cargo-llvm-cov and cargo-deny
        if: matrix.primary
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSfL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.cargo/bin"
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C "$HOME/.cargo/bin" cargo-deny-0.21.0-x86_64-unknown-linux-musl/cargo-deny
          cargo llvm-cov --version && cargo deny --version
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory), format('{0}/Cargo.toml', inputs.working-directory)) }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: make ${{ matrix.targets }}
        run: make -C "$WD" ${{ matrix.targets }}

      - name: Upload coverage summary
        if: matrix.primary && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: ${{ inputs.working-directory }}/coverage/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload package
        if: matrix.primary && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-rust
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7
